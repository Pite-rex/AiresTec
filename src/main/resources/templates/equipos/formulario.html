<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${esEdicion ? 'Editar Equipo A/A - Tec Aires' : 'Registrar Equipo A/A - Tec Aires'}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}" href="../../static/css/estilos.css">
</head>

<body class="aa-body">

    <!-- Navbar común -->
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>

    <main class="container my-5" style="max-width: 800px;">
        <div class="aa-panel">
            <div class="aa-panel-header">
                <h6
                    th:text="${esEdicion ? 'Editar Ficha Técnica de Equipo' : 'Registrar Nuevo Equipo de Aire Acondicionado'}">
                </h6>
                <i class="bi bi-hdd-network"></i>
            </div>
            <div class="aa-panel-body">
                <form th:action="@{/equipos/guardar}" th:object="${equipo}" method="post">
                    <input type="hidden" th:field="*{id}">

                    <!-- Ubicación Física -->
                    <div class="aa-section-title">1. Asignación de Ubicación Física</div>

                    <div class="aa-field-group">
                        <label for="edificioFiltro" class="aa-label">Edificio</label>
                        <div class="aa-input-wrap">
                            <span class="aa-input-icon"><i class="bi bi-buildings"></i></span>
                            <select id="edificioFiltro" class="aa-input">
                                <option value="">-- Todos los Edificios --</option>
                                <option th:each="edif : ${edificios}" th:value="${edif.id}"
                                    th:text="${edif.claveEdificio + ' - ' + edif.nombreEdificio}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="aa-field-group">
                        <label for="espacioSelect" class="aa-label">Aula / Espacio de Instalación</label>
                        <div class="aa-input-wrap">
                            <span class="aa-input-icon"><i class="bi bi-door-open"></i></span>
                            <select id="espacioSelect" name="espacio.id" class="aa-input" required>
                                <option value="">-- Selecciona el Aula / Espacio --</option>
                                <option th:each="esp : ${espacios}" th:value="${esp.id}"
                                    th:text="${esp.edificio.nombreEdificio + ' (' + esp.edificio.claveEdificio + ') - ' + esp.nombreEspacio + ' [' + esp.claveEspacio + ']'}"
                                    th:attr="data-edificio=${esp.edificio.id}"
                                    th:selected="${equipo.espacio != null and equipo.espacio.id == esp.id}">
                                </option>
                            </select>
                        </div>
                    </div>

                    <!-- Identificación del Equipo -->
                    <div class="aa-section-title">2. Identificación Institucional y de Fábrica</div>
                    <div class="row">
                        <div class="col-md-6 aa-field-group">
                            <label for="codigoEquipo" class="aa-label">Código Institucional / Inventario</label>
                            <div class="aa-input-wrap">
                                <span class="aa-input-icon"><i class="bi bi-upc-scan"></i></span>
                                <input type="text" id="codigoEquipo" th:field="*{codigoEquipo}" class="aa-input"
                                    placeholder="Ej: AA-EDIF-A-01" required th:readonly="${esEdicion}">
                            </div>
                            <div th:if="${esEdicion}" class="aa-form-hint">El código institucional no se puede
                                modificar.</div>
                        </div>
                        <div class="col-md-6 aa-field-group">
                            <label for="numeroSerie" class="aa-label">Número de Serie (S/N)</label>
                            <div class="aa-input-wrap">
                                <span class="aa-input-icon"><i class="bi bi-upc"></i></span>
                                <input type="text" id="numeroSerie" th:field="*{numeroSerie}" class="aa-input"
                                    placeholder="Ej: SN-9876543210" required th:readonly="${esEdicion}">
                            </div>
                        </div>
                    </div>

                    <!-- Especificaciones Técnicas -->
                    <div class="aa-section-title">3. Especificaciones Técnicas y Térmicas</div>
                    <div class="row">
                        <div class="col-md-6 aa-field-group">
                            <label for="marca" class="aa-label">Marca</label>
                            <div class="aa-input-wrap">
                                <span class="aa-input-icon"><i class="bi bi-tag"></i></span>
                                <input type="text" id="marca" th:field="*{marca}" class="aa-input"
                                    placeholder="Ej: Mirage, Carrier, York, LG" required>
                            </div>
                        </div>
                        <div class="col-md-6 aa-field-group">
                            <label for="modelo" class="aa-label">Modelo</label>
                            <div class="aa-input-wrap">
                                <span class="aa-input-icon"><i class="bi bi-box-seam"></i></span>
                                <input type="text" id="modelo" th:field="*{modelo}" class="aa-input"
                                    placeholder="Ej: Life 12, Inverter X" required>
                            </div>
                        </div>
                        <div class="col-md-4 aa-field-group">
                            <label for="capacidadBtu" class="aa-label">Capacidad Térmica (BTU)</label>
                            <div class="aa-input-wrap">
                                <span class="aa-input-icon"><i class="bi bi-thermometer-half"></i></span>
                                <input type="number" id="capacidadBtu" th:field="*{capacidadBtu}" class="aa-input"
                                    placeholder="Ej: 12000, 18000, 24000" min="5000" max="120000" step="1000" required>
                            </div>
                        </div>
                        <div class="col-md-4 aa-field-group">
                            <label for="tipoEquipo" class="aa-label">Tipo de Equipo</label>
                            <div class="aa-input-wrap">
                                <span class="aa-input-icon"><i class="bi bi-diagram-3"></i></span>
                                <select id="tipoEquipo" th:field="*{tipoEquipo}" class="aa-input" required>
                                    <option value="">-- Seleccionar --</option>
                                    <option value="Minisplit Convencional">Minisplit Convencional</option>
                                    <option value="Minisplit Inverter">Minisplit Inverter</option>
                                    <option value="Tipo Paquete">Tipo Paquete</option>
                                    <option value="Cassette">Cassette</option>
                                    <option value="Ventana">Ventana</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-4 aa-field-group">
                            <label for="gasRefrigerante" class="aa-label">Gas Refrigerante</label>
                            <div class="aa-input-wrap">
                                <span class="aa-input-icon"><i class="bi bi-droplet-half"></i></span>
                                <select id="gasRefrigerante" th:field="*{gasRefrigerante}" class="aa-input" required>
                                    <option value="">-- Seleccionar --</option>
                                    <option value="R-410A">R-410A</option>
                                    <option value="R-32">R-32</option>
                                    <option value="R-22">R-22</option>
                                    <option value="R-134a">R-134a</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-4 aa-field-group">
                            <label for="voltaje" class="aa-label">Voltaje de Operación</label>
                            <div class="aa-input-wrap">
                                <span class="aa-input-icon"><i class="bi bi-lightning-charge"></i></span>
                                <select id="voltaje" th:field="*{voltaje}" class="aa-input" required>
                                    <option value="220V">220V</option>
                                    <option value="110V">110V</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-4 aa-field-group">
                            <label for="fechaInstalacion" class="aa-label">Fecha de Instalación</label>
                            <div class="aa-input-wrap">
                                <span class="aa-input-icon"><i class="bi bi-calendar-event"></i></span>
                                <input type="date" id="fechaInstalacion" th:field="*{fechaInstalacion}" class="aa-input"
                                    min="1990-01-01"
                                    th:attr="max=${#temporals.format(#temporals.createToday(), 'yyyy-MM-dd')}" required>
                            </div>
                        </div>
                        <div class="col-md-4 aa-field-group">
                            <label for="estadoOperativo" class="aa-label">Estado Operativo</label>
                            <div class="aa-input-wrap">
                                <span class="aa-input-icon"><i class="bi bi-clipboard-check"></i></span>
                                <select id="estadoOperativo" th:field="*{estadoOperativo}" class="aa-input" required>
                                    <option th:each="est : ${estados}" th:value="${est}" th:text="${est}">
                                    </option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="aa-form-actions">
                        <a href="/equipos" class="aa-btn aa-btn--outline-dark aa-btn--auto">Cancelar</a>
                        <button type="submit" class="aa-btn aa-btn--dark aa-btn--auto">
                            <i class="bi bi-save"></i> Guardar Ficha de Equipo
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Filtrado de espacios según el edificio seleccionado -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const edificioFiltro = document.getElementById('edificioFiltro');
            const espacioSelect = document.getElementById('espacioSelect');
            const opciones = Array.from(espacioSelect.options);

            // Si el equipo ya tiene un espacio asignado (modo edición), preselecciona el edificio del filtro
            const seleccionInicial = opciones.find(opt => opt.selected && opt.value !== '');
            if (seleccionInicial) {
                edificioFiltro.value = seleccionInicial.getAttribute('data-edificio');
            }

            function filtrarEspacios() {
                const edificioId = edificioFiltro.value;

                opciones.forEach(opt => {
                    if (opt.value === '') { opt.hidden = false; return; }
                    const perteneceAEdificio = opt.getAttribute('data-edificio') === edificioId;
                    opt.hidden = edificioId !== '' && !perteneceAEdificio;
                });

                const seleccionActual = opciones.find(opt => opt.value === espacioSelect.value);
                if (edificioId !== '' && seleccionActual && seleccionActual.hidden) {
                    espacioSelect.value = '';
                }
            }

            filtrarEspacios();
            edificioFiltro.addEventListener('change', filtrarEspacios);
        });
    </script>
</body>

</html>
