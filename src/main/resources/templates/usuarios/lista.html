<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Personal y Usuarios - Tec Aires</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}" href="../../static/css/estilos.css">
</head>
<body class="aa-body">

    <!-- Navbar común -->
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>

    <main class="container-fluid px-3 px-md-4 my-4">

        <div class="aa-page-header">
            <div>
                <h2 class="aa-page-title">Catálogo de Personal y Usuarios</h2>
                <p class="aa-page-subtitle mb-0">Control de credenciales, datos de contacto y roles de acceso (ART-08)</p>
            </div>
            <div class="aa-actions">
                <a href="/usuarios/nuevo" class="aa-btn aa-btn--dark aa-btn--auto">
                    <i class="bi bi-person-plus-fill"></i> Registrar Usuario
                </a>
            </div>
        </div>

        <!-- Alertas de notificación -->
        <div th:if="${exito}" class="aa-alert aa-alert--success aa-alert--dismissible">
            <span th:text="${exito}"></span>
            <button type="button" class="aa-alert-close" onclick="this.parentElement.remove()" aria-label="Cerrar">&times;</button>
        </div>
        <div th:if="${error}" class="aa-alert aa-alert--danger aa-alert--dismissible">
            <span th:text="${error}"></span>
            <button type="button" class="aa-alert-close" onclick="this.parentElement.remove()" aria-label="Cerrar">&times;</button>
        </div>

        <!-- Tabla de Usuarios -->
        <div class="aa-panel">
            <div class="table-responsive">
                <table class="aa-table">
                    <thead>
                        <tr>
                            <th>Usuario (Username)</th>
                            <th>Rol Asignado</th>
                            <th>Teléfono</th>
                            <th>Fecha Registro</th>
                            <th class="text-end">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${usuarios}">
                            <!-- Le puse la clase aa-folio aquí para que mantenga el estilo resaltado que tenía el nombre -->
                            <td data-label="Usuario" class="aa-folio" th:text="${user.username}"></td>
                            
                            <td data-label="Rol">
                                <span th:if="${user.rol.name() == 'ADMINISTRADOR'}" class="aa-tag aa-tag--urgente">Administrador</span>
                                <span th:if="${user.rol.name() == 'TECNICO'}" class="aa-tag aa-tag--alta">Técnico</span>
                                <span th:if="${user.rol.name() == 'PERSONAL_SERVICIO_SOCIAL'}" class="aa-tag aa-tag--media">Servicio Social</span>
                            </td>
                            
                            <!-- Eliminamos el correo y dejamos solo el teléfono -->
                            <td data-label="Teléfono">
                                <div class="aa-contact-line">
                                    <i class="bi bi-telephone"></i>
                                    <span th:text="${user.telefono ?: 'N/A'}"></span>
                                </div>
                            </td>
                            
                            <td data-label="Registro" th:text="${user.fechaRegistro}"></td>
                            
                            <td data-label="Acciones" class="aa-td-accion">
                                <div class="aa-row-actions">
                                    <a th:href="@{/usuarios/editar/{id}(id=${user.id})}" class="aa-action-btn aa-action-btn--muted" title="Editar">
                                        <i class="bi bi-pencil"></i> Editar
                                    </a>
                                    <a th:href="@{/usuarios/eliminar/{id}(id=${user.id})}"
                                       class="aa-action-btn aa-action-btn--danger aa-action-btn--icon"
                                       title="Eliminar"
                                       onclick="return confirm('¿Está seguro de eliminar este usuario? Esta acción no se puede deshacer.');">
                                        <i class="bi bi-trash"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(usuarios)}">
                            <!-- Cambié colspan de 7 a 5 para que cuadre con las nuevas columnas -->
                            <td colspan="5" class="aa-table-empty">No hay usuarios registrados en el sistema.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
