<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Levantar Reporte de Falla - Tec Aires</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}" href="../../static/css/estilos.css">
</head>

<body class="aa-body">
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>

    <main class="container my-5" style="max-width: 750px;">
        <div class="aa-panel">
            <div class="aa-panel-header">
                <h6>Levantar Nuevo Reporte / Ticket de Falla</h6>
                <i class="bi bi-exclamation-octagon"></i>
            </div>
            <div class="aa-panel-body">
                <form th:action="@{/reportes/guardar}" method="post">
                    <input type="hidden" name="esPublico" value="false" />

                    <div class="aa-section-title">1. Equipo con Incidencia</div>

                    <div class="aa-field-group">
                        <label for="edificioFiltro" class="aa-label">Edificio</label>
                        <div class="aa-input-wrap">
                            <span class="aa-input-icon"><i class="bi bi-buildings"></i></span>
                            <select id="edificioFiltro" class="aa-input">
                                <option value="">-- Todos los Edificios --</option>
                                <option th:each="edif : ${edificios}" th:value="${edif.id}" th:text="${edif.claveEdificio + ' - ' + edif.nombreEdificio}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="aa-field-group">
                        <label for="equipoSelect" class="aa-label">Seleccionar Equipo</label>
                        <div class="aa-input-wrap">
                            <span class="aa-input-icon"><i class="bi bi-hdd-network"></i></span>
                            <select id="equipoSelect" name="equipo.id" class="aa-input" required>
                                <option value="">-- Selecciona el Equipo Afectado --</option>
                                <option th:each="equipoItem : ${equipos}"
                                        th:value="${equipoItem.id}"
                                        th:text="${equipoItem.codigoEquipo} + (${equipoItem.espacio} != null ? ' - ' + ${equipoItem.espacio.nombreEspacio} : '')"
                                        th:attr="data-edificio=${equipoItem.espacio != null ? equipoItem.espacio.edificio.id : ''}"
                                        th:selected="${equipoSeleccionadoId != null and equipoItem.id == equipoSeleccionadoId}">
                                </option>
                            </select>
                        </div>
                    </div>

                    <div class="aa-section-title">2. Datos del Solicitante</div>

                    <div class="aa-field-group">
                        <label for="nombreSolicitante" class="aa-label">Nombre Completo</label>
                        <div class="aa-input-wrap">
                            <span class="aa-input-icon"><i class="bi bi-person"></i></span>
                            <input type="text" id="nombreSolicitante" name="nombreSolicitante" class="aa-input"
                                th:value="${nombreUsuarioActual}" readonly required>
                        </div>
                    </div>

                    <div class="aa-field-group">
                        <label for="prioridad" class="aa-label">Prioridad</label>
                        <div class="aa-input-wrap">
                            <span class="aa-input-icon"><i class="bi bi-flag"></i></span>
                            <select id="prioridad" name="prioridad" class="aa-input" required>
                                <option value="MEDIA" selected>MEDIA</option>
                                <option value="ALTA">ALTA</option>
                                <option value="URGENTE">URGENTE</option>
                                <option value="BAJA">BAJA</option>
                            </select>
                        </div>
                    </div>

                    <div class="aa-field-group">
                        <label for="descripcionFalla" class="aa-label">Descripción</label>
                        <div class="aa-input-wrap">
                            <textarea id="descripcionFalla" name="descripcionFalla" class="aa-input" rows="4" required></textarea>
                        </div>
                    </div>

                    <div class="aa-form-actions">
                        <a th:href="@{/reportes}" class="aa-btn aa-btn--outline-dark aa-btn--auto">Cancelar</a>
                        <button type="submit" class="aa-btn aa-btn--dark aa-btn--auto">
                            <i class="bi bi-check-circle"></i> Generar Ticket
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Filtrado de equipos según el edificio seleccionado -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const edificioFiltro = document.getElementById('edificioFiltro');
            const equipoSelect = document.getElementById('equipoSelect');
            const opciones = Array.from(equipoSelect.options);

            function filtrarEquipos() {
                const edificioId = edificioFiltro.value;

                opciones.forEach(opt => {
                    if (opt.value === '') {
                        opt.hidden = false;
                        return;
                    }
                    const perteneceAEdificio = opt.getAttribute('data-edificio') === edificioId;
                    opt.hidden = edificioId !== '' && !perteneceAEdificio;
                });

                // Si la opción seleccionada ya no aplica al edificio, regresa al placeholder
                const seleccionActual = opciones.find(opt => opt.value === equipoSelect.value);
                if (edificioId !== '' && seleccionActual && seleccionActual.hidden) {
                    equipoSelect.value = '';
                }
            }

            edificioFiltro.addEventListener('change', filtrarEquipos);
        });
    </script>
</body>

</html>
