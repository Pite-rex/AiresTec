<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviso - Tec Aires</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}" href="../../static/css/estilos.css">
</head>

<body class="aa-body py-5">
    <main class="container" style="max-width: 600px;">
        <div class="aa-panel text-center p-4">
            <div class="aa-badge" style="width: 72px; height: 72px; margin-bottom: 1rem;">
                <i class="bi" th:classappend="${icono}" style="font-size: 1.9rem;"></i>
            </div>
            <div class="aa-title" style="font-size: 1.3rem;" th:text="${titulo}">Aviso</div>
            <p class="aa-subtitle mb-0" th:text="${mensaje}"></p>
        </div>
        <div class="aa-footnote">Instituto Tecnológico &bull; Control de Aire Acondicionado (Tec Aires)</div>
    </main>
</body>

</html>
