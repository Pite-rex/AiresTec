<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Edificios y Aulas - Tec Aires</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}" href="../static/css/estilos.css">
</head>

<body class="aa-body">

    <!-- Navbar común -->
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>

    <main class="container-fluid px-3 px-md-4 my-4">

        <!-- Encabezado con botones de registro -->
        <div class="aa-page-header">
            <div>
                <h2 class="aa-page-title">Catálogo de Edificios y Aulas</h2>
                <p class="aa-page-subtitle mb-0">Gestión de infraestructura física y espacios climatizados del plantel
                </p>
            </div>
            <div class="aa-actions">
                <a href="/espacios/nuevo" class="aa-btn aa-btn--outline-dark aa-btn--auto">
                    <i class="bi bi-door-open"></i> Registrar Aula / Espacio
                </a>
                <a href="/edificios/nuevo" class="aa-btn aa-btn--dark aa-btn--auto">
                    <i class="bi bi-building-add"></i> Registrar Edificio
                </a>
            </div>
        </div>

        <!-- Alertas de notificación -->
        <div th:if="${exito}" class="aa-alert aa-alert--success aa-alert--dismissible">
            <span th:text="${exito}"></span>
            <button type="button" class="aa-alert-close" onclick="this.parentElement.remove()"
                aria-label="Cerrar">&times;</button>
        </div>
        <div th:if="${error}" class="aa-alert aa-alert--danger aa-alert--dismissible">
            <span th:text="${error}"></span>
            <button type="button" class="aa-alert-close" onclick="this.parentElement.remove()"
                aria-label="Cerrar">&times;</button>
        </div>

        <!-- Tabla Principal -->
        <div class="aa-panel">
            <div class="table-responsive">
                <table class="aa-table">
                    <thead>
                        <tr>
                            <th>Clave</th>
                            <th>Nombre del Edificio</th>
                            <th>Referencia / Ubicación</th>
                            <th class="text-center">Aulas</th>
                            <th class="text-end">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="edif : ${edificios}">
                            <td data-label="Clave" class="aa-folio" th:text="${edif.claveEdificio}"></td>
                            <td data-label="Nombre" th:text="${edif.nombreEdificio}"></td>
                            <td data-label="Referencia" th:text="${edif.referenciaUbicacion ?: 'Sin referencia'}"></td>

                            <!-- Conteo de aulas registradas -->
                            <td data-label="Aulas">
                                <span class="aa-tag aa-tag--neutral"
                                    th:text="${edif.espacios != null ? #lists.size(edif.espacios) + ' aulas' : '0 aulas'}">
                                </span>
                            </td>

                            <!-- Acciones integradas -->
                            <td data-label="Acciones" class="aa-td-accion">
                                <div class="aa-row-actions">
                                    <!-- Ver catálogo de aulas de este edificio -->
                                    <a th:href="@{/espacios(edificioId=${edif.id})}"
                                        class="aa-action-btn aa-action-btn--info"
                                        title="Ver todas las aulas de este edificio">
                                        <i class="bi bi-door-open"></i> Ver Aulas
                                    </a>

                                    <!-- Agregar aula asignada directamente a este edificio -->
                                    <a th:href="@{/espacios/nuevo(edificioId=${edif.id})}"
                                        class="aa-action-btn aa-action-btn--success aa-action-btn--icon"
                                        title="Agregar aula a este edificio">
                                        <i class="bi bi-plus-lg"></i>
                                    </a>

                                    <!-- Editar Edificio -->
                                    <a th:href="@{/edificios/editar/{id}(id=${edif.id})}"
                                        class="aa-action-btn aa-action-btn--muted aa-action-btn--icon"
                                        title="Editar Edificio">
                                        <i class="bi bi-pencil"></i>
                                    </a>

                                    <!-- Eliminar Edificio -->
                                    <a th:href="@{/edificios/eliminar/{id}(id=${edif.id})}"
                                        class="aa-action-btn aa-action-btn--danger aa-action-btn--icon"
                                        title="Eliminar Edificio"
                                        onclick="return confirm('¿Está seguro de eliminar este edificio? Se eliminarán también las aulas asociadas.');">
                                        <i class="bi bi-trash"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(edificios)}">
                            <td colspan="5" class="aa-table-empty">No hay edificios registrados en el sistema.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
