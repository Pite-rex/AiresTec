<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Edificio - Tec Aires</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}" href="../static/css/estilos.css">
</head>

<body class="aa-body">

    <nav th:replace="~{fragments/navbar :: navbar}"></nav>

    <main class="container my-5" style="max-width: 600px;">
        <div class="aa-panel">
            <div class="aa-panel-header">
                <h6 th:text="${edificio.id == null} ? 'Registrar Nuevo Edificio' : 'Editar Edificio'"></h6>
                <i class="bi bi-building"></i>
            </div>
            <div class="aa-panel-body">
                <form th:action="@{/edificios/guardar}" th:object="${edificio}" method="post">
                    <input type="hidden" th:field="*{id}">

                    <div class="aa-field-group">
                        <label for="claveEdificio" class="aa-label">Clave del Edificio</label>
                        <div class="aa-input-wrap">
                            <span class="aa-input-icon"><i class="bi bi-upc-scan"></i></span>
                            <input type="text" id="claveEdificio" th:field="*{claveEdificio}" class="aa-input"
                                placeholder="Ej: EDIF-01" required>
                        </div>
                    </div>

                    <div class="aa-field-group">
                        <label for="nombreEdificio" class="aa-label">Nombre del Edificio</label>
                        <div class="aa-input-wrap">
                            <span class="aa-input-icon"><i class="bi bi-building"></i></span>
                            <input type="text" id="nombreEdificio" th:field="*{nombreEdificio}" class="aa-input"
                                placeholder="Ej: Edificio A, Laboratorios Ligeros" required>
                        </div>
                    </div>

                    <div class="aa-field-group">
                        <label for="referenciaUbicacion" class="aa-label">Referencia de Ubicación (Opcional)</label>
                        <div class="aa-input-wrap">
                            <span class="aa-input-icon"><i class="bi bi-geo-alt"></i></span>
                            <input type="text" id="referenciaUbicacion" th:field="*{referenciaUbicacion}"
                                class="aa-input" placeholder="Ej: Frente a la plaza cívica">
                        </div>
                    </div>

                    <div class="aa-form-actions">
                        <a href="/edificios" class="aa-btn aa-btn--outline-dark aa-btn--auto">Cancelar</a>
                        <button type="submit" class="aa-btn aa-btn--dark aa-btn--auto">
                            <i class="bi bi-save"></i> Guardar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
