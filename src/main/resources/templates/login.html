<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Tec Aires</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}" href="static/css/estilos.css">
</head>

<body class="aa-body">

    <div class="aa-center-screen">
        <div class="aa-card aa-card--sm">

            <div class="text-center mb-4">
                <div class="aa-badge">
                    <i class="bi bi-fan"></i>
                </div>
                <div class="aa-title">Tec Aires</div>
                <div class="aa-subtitle">Sistema de Control de Inventario y Mantenimiento</div>
            </div>

            <div th:if="${param.error}" class="aa-alert aa-alert--danger" role="alert">
                Usuario o contraseña incorrectos, o cuenta inactiva.
            </div>
            <div th:if="${param.logout}" class="aa-alert aa-alert--info" role="alert">
                Has cerrado sesión correctamente.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="aa-field-group">
                    <label for="username" class="aa-label">Usuario</label>
                    <div class="aa-input-wrap">
                        <span class="aa-input-icon"><i class="bi bi-person"></i></span>
                        <input type="text" class="aa-input" id="username" name="username"
                            placeholder="Ingresa tu usuario" required autofocus>
                    </div>
                </div>

                <div class="aa-field-group">
                    <label for="password" class="aa-label">Contraseña</label>
                    <div class="aa-input-wrap">
                        <span class="aa-input-icon"><i class="bi bi-lock"></i></span>
                        <input type="password" class="aa-input" id="password" name="password"
                            placeholder="Ingresa tu contraseña" required>
                    </div>
                </div>

                <button type="submit" class="aa-btn aa-btn--dark">
                    <i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión
                </button>
            </form>

            <div class="aa-footnote">Instituto Tecnológico · Acceso restringido al personal autorizado</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
