<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Espacio - Tec Aires</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}" href="../../static/css/estilos.css">
</head>
<body class="aa-body">

    <!-- Navbar común -->
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>

    <main class="container my-5" style="max-width: 650px;">
        <div class="aa-panel">
            <div class="aa-panel-header">
                <h6 th:text="${espacio.id == null} ? 'Registrar Nuevo Espacio / Aula' : 'Editar Espacio'"></h6>
                <i class="bi bi-door-open"></i>
            </div>
            <div class="aa-panel-body">
                <form th:action="@{/espacios/guardar}" th:object="${espacio}" method="post">
                    <input type="hidden" th:field="*{id}">

                    <!-- Selección de Edificio -->
                    <div class="aa-field-group">
                        <label for="edificio" class="aa-label">Edificio Perteneciente</label>
                        <div class="aa-input-wrap">
                            <span class="aa-input-icon"><i class="bi bi-building"></i></span>
                            <select id="edificio" name="edificio.id" class="aa-input" required>
                                <option value="">-- Selecciona un Edificio --</option>
                                <option th:each="edif : ${edificios}"
                                        th:value="${edif.id}"
                                        th:text="${edif.claveEdificio + ' - ' + edif.nombreEdificio}"
                                        th:selected="${espacio.edificio != null and espacio.edificio.id == edif.id}">
                                </option>
                            </select>
                        </div>
                    </div>

                    <!-- Clave del Espacio -->
                    <div class="aa-field-group">
                        <label for="claveEspacio" class="aa-label">Clave del Espacio</label>
                        <div class="aa-input-wrap">
                            <span class="aa-input-icon"><i class="bi bi-upc-scan"></i></span>
                            <input type="text" id="claveEspacio" th:field="*{claveEspacio}" class="aa-input"
                                placeholder="Ej: ESP-001, LAB-01, AULA-10" required>
                        </div>
                    </div>

                    <!-- Nombre del Espacio -->
                    <div class="aa-field-group">
                        <label for="nombreEspacio" class="aa-label">Nombre del Espacio</label>
                        <div class="aa-input-wrap">
                            <span class="aa-input-icon"><i class="bi bi-door-open"></i></span>
                            <input type="text" id="nombreEspacio" th:field="*{nombreEspacio}" class="aa-input"
                                placeholder="Ej: Laboratorio de Redes, Aula Magna" required>
                        </div>
                    </div>

                    <!-- Clasificación / Tipo de Espacio -->
                    <div class="aa-field-group">
                        <label for="tipoEspacio" class="aa-label">Tipo de Espacio</label>
                        <div class="aa-input-wrap">
                            <span class="aa-input-icon"><i class="bi bi-tags"></i></span>
                            <select id="tipoEspacio" th:field="*{tipoEspacio}" class="aa-input" required>
                                <option value="">-- Selecciona el Tipo --</option>
                                <option th:each="tipo : ${tiposEspacio}"
                                        th:value="${tipo}"
                                        th:text="${tipo}">
                                </option>
                            </select>
                        </div>
                    </div>

                    <div class="aa-form-actions">
                        <a href="/espacios" class="aa-btn aa-btn--outline-dark aa-btn--auto">Cancelar</a>
                        <button type="submit" class="aa-btn aa-btn--dark aa-btn--auto">
                            <i class="bi bi-save"></i> Guardar Espacio
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
