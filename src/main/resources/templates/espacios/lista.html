<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Aulas y Espacios - Tec Aires</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}" href="../../static/css/estilos.css">
</head>
<body class="aa-body">

    <!-- Navbar común -->
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>

    <main class="container-fluid px-3 px-md-4 my-4">

        <div class="aa-page-header">
            <div>
                <h2 class="aa-page-title">Aulas y Espacios Físicos</h2>
                <p class="aa-page-subtitle mb-0">Gestión de salones, oficinas, laboratorios y auditorios</p>
            </div>
            <div class="aa-actions">
                <a href="/espacios/nuevo" class="aa-btn aa-btn--dark aa-btn--auto">
                    <i class="bi bi-plus-circle"></i> Registrar Espacio
                </a>
            </div>
        </div>

        <!-- Alertas de éxito o error -->
        <div th:if="${exito}" class="aa-alert aa-alert--success aa-alert--dismissible">
            <span th:text="${exito}"></span>
            <button type="button" class="aa-alert-close" onclick="this.parentElement.remove()" aria-label="Cerrar">&times;</button>
        </div>
        <div th:if="${error}" class="aa-alert aa-alert--danger aa-alert--dismissible">
            <span th:text="${error}"></span>
            <button type="button" class="aa-alert-close" onclick="this.parentElement.remove()" aria-label="Cerrar">&times;</button>
        </div>

        <!-- Filtro por Edificio -->
        <form th:action="@{/espacios}" method="get" class="aa-filter-bar">
            <span class="aa-filter-label"><i class="bi bi-funnel"></i> Filtrar por Edificio:</span>
            <div class="aa-input-wrap">
                <select name="edificioId" id="filtroEdificio" class="aa-input" onchange="this.form.submit()">
                    <option value="">-- Todos los Edificios --</option>
                    <option th:each="edif : ${edificios}"
                            th:value="${edif.id}"
                            th:text="${edif.claveEdificio + ' - ' + edif.nombreEdificio}"
                            th:selected="${edif.id == edificioSeleccionado}">
                    </option>
                </select>
            </div>
            <a th:if="${edificioSeleccionado != null}" href="/espacios" class="aa-btn aa-btn--outline-dark aa-btn--auto aa-btn--sm">Limpiar Filtro</a>
        </form>

        <!-- Tabla de Espacios -->
        <div class="aa-panel">
            <div class="table-responsive">
                <table class="aa-table">
                    <thead>
                        <tr>
                            <th>Clave</th>
                            <th>Nombre del Espacio</th>
                            <th>Tipo</th>
                            <th>Edificio Perteneciente</th>
                            <th class="text-end">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="espacio : ${espacios}">
                            <td data-label="Clave" class="aa-folio" th:text="${espacio.claveEspacio}"></td>
                            <td data-label="Nombre" th:text="${espacio.nombreEspacio}"></td>
                            <td data-label="Tipo">
                                <span class="aa-tag aa-tag--neutral" th:text="${espacio.tipoEspacio}"></span>
                            </td>
                            <td data-label="Edificio" th:text="${espacio.edificio.nombreEdificio} + ' (' + ${espacio.edificio.claveEdificio} + ')'"></td>
                            <td data-label="Acciones" class="aa-td-accion">
                                <div class="aa-row-actions">
                                    <a th:href="@{/espacios/editar/{id}(id=${espacio.id})}" class="aa-action-btn aa-action-btn--muted">
                                        <i class="bi bi-pencil"></i> Editar
                                    </a>
                                    <a th:href="@{/espacios/eliminar/{id}(id=${espacio.id})}"
                                       class="aa-action-btn aa-action-btn--danger"
                                       onclick="return confirm('¿Está seguro de eliminar este espacio físico?');">
                                        <i class="bi bi-trash"></i> Eliminar
                                    </a>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(espacios)}">
                            <td colspan="5" class="aa-table-empty">No se encontraron espacios registrados para este criterio.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
