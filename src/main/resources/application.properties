spring.application.name=aires
server.port=8080

# Conexión a la base de datos de MySQL en XAMPP
spring.datasource.url=jdbc:mysql://localhost:3306/tec_aires_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA (Crea y actualiza tablas automáticamente)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Mantener la sesión de Hibernate abierta durante la renderización de Thymeleaf
# Permite acceder a relaciones lazy (ej: esp.edificio) en las plantillas
spring.jpa.open-in-view=true

# Desactivar caché de Thymeleaf para desarrollo
spring.thymeleaf.cache=false